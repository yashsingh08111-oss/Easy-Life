<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signup - HomeFix</title>

  <link rel="stylesheet" href="signup.css">

</head>

<body>

  <div class="signup-container">

    <div class="signup-box">

      <h1>Create Account</h1>

      <p class="subtitle">
        Join HomeFix and book trusted services
      </p>

      <!-- SIGNUP FORM -->

      <form id="signupForm">

        <input 
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <input 
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <input 
          type="password"
          id="password"
          placeholder="Create your password"
          required
        >

        <button type="submit">
          Sign Up
        </button>

      </form>

      <p class="bottom-text">
        Already have an account?
        <a href="./login.html">Login</a>
      </p>

    </div>

  </div>

  <!-- CONNECT JS -->

  <script src="./signup.js"></script>

</body>

</html>
